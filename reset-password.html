<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Exam Prep Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .hide { display: none !important; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
    
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-8 text-white text-center">
            <h2 class="text-3xl font-extrabold mb-2">Reset Password</h2>
            <p class="text-indigo-100 text-sm">Enter a new password for your account.</p>
        </div>
        
        <div class="p-8 space-y-6" id="reset-content">
            <div id="reset-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">New Password</label>
                    <div class="relative">
                        <input type="password" id="new-password" placeholder="••••••••" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none pr-10">
                        <button type="button" onclick="togglePassword('new-password', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Confirm Password</label>
                    <div class="relative">
                        <input type="password" id="confirm-password" placeholder="••••••••" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none pr-10">
                        <button type="button" onclick="togglePassword('confirm-password', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button id="reset-btn" class="w-full py-2.5 px-4 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition">Update Password</button>

                <p id="error-msg" class="text-sm text-red-500 text-center hide"></p>
                <p id="success-msg" class="text-sm text-emerald-600 text-center hide"></p>
            </div>
            
            <div id="invalid-token" class="hide text-center space-y-4">
                <p class="text-rose-600 font-bold text-lg">Invalid or Expired Link</p>
                <p class="text-sm text-slate-600">The password reset link is invalid or has expired. Please request a new one.</p>
                <a href="login.html" class="inline-block w-full py-2.5 px-4 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        const token = urlParams.get('token');

        const resetForm = document.getElementById('reset-form');
        const invalidToken = document.getElementById('invalid-token');
        const newPassword = document.getElementById('new-password');
        const confirmPassword = document.getElementById('confirm-password');
        const resetBtn = document.getElementById('reset-btn');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('svg');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        if (!email || !token) {
            resetForm.classList.add('hide');
            invalidToken.classList.remove('hide');
        }

        resetBtn.addEventListener('click', async () => {
            const pass1 = newPassword.value;
            const pass2 = confirmPassword.value;

            errorMsg.classList.add('hide');
            successMsg.classList.add('hide');

            if (!pass1 || pass1.length < 6) {
                errorMsg.textContent = 'Password must be at least 6 characters long.';
                errorMsg.classList.remove('hide');
                return;
            }
            if (pass1 !== pass2) {
                errorMsg.textContent = 'Passwords do not match.';
                errorMsg.classList.remove('hide');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = 'Updating...';

            try {
                const formData = new FormData();
                formData.append('action', 'reset_password');
                formData.append('email', email);
                formData.append('token', token);
                formData.append('password', pass1);

                const response = await fetch('api.php', { method: 'POST', body: formData });
                const data = await response.json();
                
                if (data.success) {
                    successMsg.textContent = data.message || 'Password reset successfully. Redirecting to login...';
                    successMsg.classList.remove('hide');
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else {
                    errorMsg.textContent = data.message || 'Failed to reset password.';
                    errorMsg.classList.remove('hide');
                    if (data.message.includes('expired') || data.message.includes('Invalid')) {
                        setTimeout(() => {
                            resetForm.classList.add('hide');
                            invalidToken.classList.remove('hide');
                        }, 2000);
                    }
                }
            } catch (error) {
                errorMsg.textContent = 'Error connecting to server.';
                errorMsg.classList.remove('hide');
            } finally {
                resetBtn.disabled = false;
                resetBtn.textContent = 'Update Password';
            }
        });
    </script>
</body>
</html>

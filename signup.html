<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Exam Prep Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .hide { display: none !important; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-8 text-white text-center">
            <h2 class="text-3xl font-extrabold mb-2">Create Account</h2>
            <p class="text-indigo-100 text-sm">Sign up is optional — use login for OTP access</p>
        </div>

        <!-- Signup Form -->
        <div id="signup-form" class="p-8 space-y-6">
            <div id="signup-error" class="text-sm text-red-500 text-center hide"></div>
            <div id="signup-success" class="text-sm text-emerald-600 text-center hide"></div>

            <!-- Name Input -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Your Name</label>
                <input type="text" id="name-input" placeholder="e.g. Rahul" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
            </div>

            <!-- Email Input -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
                <input type="email" id="email-input" placeholder="your@email.com" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
            </div>

            <!-- Password Input -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                <div class="relative">
                    <input type="password" id="password-input" placeholder="••••••••" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none pr-10">
                    <button type="button" onclick="togglePassword('password-input', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <button id="signup-btn" class="w-full py-2.5 px-4 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition">Sign Up</button>

            <div class="text-center text-sm text-slate-600">
                Already have an account?
                <a href="login.html" class="text-indigo-600 font-semibold hover:underline">Login</a>
            </div>
        </div>

        <!-- OTP Verification (Hidden initially) -->
        <div id="otp-form" class="p-8 space-y-4 hide">

            <p class="text-sm text-slate-600 text-center">Enter the verification code sent to <strong id="email-display"></strong></p>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Verification Code</label>
                <input type="text" id="otp-input" placeholder="000000" maxlength="6" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none text-center text-2xl tracking-widest">
            </div>
            <button id="verify-otp-btn" class="w-full py-2.5 px-4 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition">Verify Email</button>
            <p id="otp-error" class="text-sm text-red-500 text-center hide"></p>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const signupForm = $('signup-form');
        const otpForm = $('otp-form');
        const nameInput = $('name-input');
        const emailInput = $('email-input');
        const passwordInput = $('password-input');
        const signupBtn = $('signup-btn');
        const signupError = $('signup-error');
        const signupSuccess = $('signup-success');
        
        const otpInput = $('otp-input');
        const verifyOtpBtn = $('verify-otp-btn');
        const otpError = $('otp-error');
        const emailDisplay = $('email-display');

        
        let registeredEmail = '';

        function show(el, isVisible) {
            if (!el) return;
            el.classList.toggle('hide', !isVisible);
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('svg');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        signupBtn.addEventListener('click', async () => {
            const name = (nameInput.value || '').trim();
            const email = (emailInput.value || '').trim();
            const password = (passwordInput.value || '');

            show(signupError, false);
            show(signupSuccess, false);

            if (!name || name.length < 2) {
                signupError.textContent = 'Please enter a valid name.';
                show(signupError, true);
                return;
            }
            if (!email || !email.includes('@')) {
                signupError.textContent = 'Please enter a valid email address.';
                show(signupError, true);
                return;
            }
            if (!password || password.length < 6) {
                signupError.textContent = 'Password must be at least 6 characters long.';
                show(signupError, true);
                return;
            }

            signupBtn.disabled = true;
            signupBtn.textContent = 'Creating...';

            try {
                // This repo currently supports OTP-based login.
                // If your backend does not implement signup, this endpoint will return an error.
                const res = await fetch('api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'signup', name, email, password })
                });

                const text = await res.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    data = { success: false, message: 'Server returned invalid response.' };
                }

                if (data && data.success) {
                    show(signupSuccess, true);
                    signupSuccess.textContent = 'Account created. Sending verification code...';
                    registeredEmail = email;
                    
                    // Send OTP automatically after successful signup
                    try {
                        const otpRes = await fetch('api.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'send_otp', email: email, type: 'signup' })
                        });
                        
                        const otpText = await otpRes.text();
                        let otpData;
                        try {
                            otpData = JSON.parse(otpText);
                        } catch (e) {
                            console.warn('Non-JSON response from send_otp:', otpText);
                            otpData = { success: true }; // Assume success if server sent warning text
                        }
                        
                        if (otpData.success) {
                            show(signupForm, false);
                            show(otpForm, true);
                            emailDisplay.textContent = email;
                            

                        } else {
                            signupError.textContent = otpData.message || 'Account created, but failed to send verification code. Please login to verify.';
                            show(signupError, true);
                        }
                    } catch (e) {
                        console.error('OTP Send Error:', e);
                        // Show OTP form anyway so they can at least attempt manual resend/check email
                        show(signupForm, false);
                        show(otpForm, true);
                        emailDisplay.textContent = email;
                    }
                } else {
                    signupError.textContent = (data && data.message) ? data.message : 'Signup not available. Please login using OTP.';
                    show(signupError, true);
                }
            } catch (e) {
                signupError.textContent = 'Network error. Please try again.';
                show(signupError, true);
            } finally {
                signupBtn.disabled = false;
                signupBtn.textContent = 'Sign Up';
            }
        });

        verifyOtpBtn.addEventListener('click', async () => {
            const otp = (otpInput.value || '').trim();
            if (!otp || otp.length < 6) {
                otpError.textContent = 'Please enter a valid code';
                show(otpError, true);
                return;
            }
            
            show(otpError, false);
            verifyOtpBtn.disabled = true;
            verifyOtpBtn.textContent = 'Verifying...';

            try {
                const response = await fetch('api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'verify_otp', email: registeredEmail, otp: otp })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Store session data upon successful verification & login
                    localStorage.setItem('user_email', registeredEmail);
                    if (data.user) {
                        localStorage.setItem('user_id', data.user.id || '');
                        localStorage.setItem('user_verified', data.user.is_verified || true);
                        localStorage.setItem('user_created_at', data.user.created_at || new Date().toISOString());
                        localStorage.setItem('user_login_time', data.user.login_time || new Date().toISOString());
                        localStorage.setItem('user_profile', JSON.stringify(data.user));
                        localStorage.setItem('session_token', data.session_token || '');
                    }
                    localStorage.setItem('login_timestamp', new Date().toISOString());
                    
                    window.location.href = 'index.html';
                } else {
                    otpError.textContent = data.message || 'Invalid code';
                    show(otpError, true);
                }
            } catch (error) {
                otpError.textContent = 'Error connecting to server. Try again.';
                show(otpError, true);
            } finally {
                verifyOtpBtn.disabled = false;
                verifyOtpBtn.textContent = 'Verify Email';
            }
        });
    </script>
</body>
</html>
